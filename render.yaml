services:
  - type: web
    name: aikiz-crm
    runtime: node
    buildCommand: bash scripts/swap-postgres.sh && npx prisma generate && npx next build
    startCommand: npx prisma db push --skip-generate && npx bun run server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: aikiz-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          name: aikiz-crm
          type: web
          property: hostport


databases:
  - name: aikiz-db
    databaseName: aikiz_crm
    plan: free
